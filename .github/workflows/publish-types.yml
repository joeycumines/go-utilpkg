name: Publish types

# Publishes the @joeycumines/goja_nodejs TypeScript type-definition package to
# the GitHub Packages npm registry (npm.pkg.github.com). There are no manual
# releases: every publish is a rolling canary version derived from the commit,
# and the npm `latest` dist-tag tracks the newest publish (= latest synced HEAD).
#
# Triggers:
#   - push to main (human pushes / direct commits)
#   - workflow_call (invoked by sync-upstream.yml after it pushes a synced main)
#   - workflow_dispatch (manual)
#
# Auth: the default GITHUB_TOKEN is sufficient for publishing to the same
# owner's GitHub Packages (no PAT, no npm MFA). setup-node writes the .npmrc;
# NODE_AUTH_TOKEN must be on the publish step's env. No --provenance (that is an
# npmjs.com-only feature and fails against npm.pkg.github.com).

on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: Commit ref (SHA) to publish. Defaults to the triggering commit.
        required: false
        type: string
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  # Serialize publishes for the same target commit so two triggers (e.g. a push
  # and a sync call) can't race to publish the same version.
  group: publish-${{ inputs.ref || github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: https://npm.pkg.github.com
          scope: '@joeycumines'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check (gate)
        # Never publish type definitions that don't compile.
        run: npm test --workspaces

      - name: Stamp rolling version
        env:
          REF: ${{ inputs.ref || github.sha }}
        run: |
          DATE=$(git show -s --format=%cd --date=format:%Y%m%d "$REF")
          SHORT=$(git rev-parse --short=12 "$REF")
          VERSION="0.0.0-${DATE}.${SHORT}"
          # Write the version directly into the package (no npm version, no git
          # commit/tag) — safe inside CI.
          jq --arg v "$VERSION" '.version = $v' types/package.json > /tmp/pkg.json
          mv /tmp/pkg.json types/package.json
          echo "Publishing version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_ENV"

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish --workspace types
