name: Sync upstream

# Keeps joeycumines/goja_nodejs:main in sync with dop251/goja_nodejs:master.
#
# Merge upstream/master into main. If the merge is clean, OR if it conflicts
# ONLY on go.mod/go.sum (the perpetual conflict — the fork rebrands the module
# path and pins the sibling joeycumines/goja), the conflict is AUTO-RESOLVED by
# taking upstream's go.mod, re-applying the fork's identity, and running
# `go mod tidy`. The merged tree is then validated (vet + build + go test -race
# + npm type-check); if green it is pushed directly to main and the type
# definitions are republished. Any other conflict (source code), or a validation
# failure, or a rejected push, opens a descriptive PR instead.
#
# Why inline validation: pushes made with the auto GITHUB_TOKEN do not fire
# downstream `on: push` workflows, so this workflow is itself the gate that
# proves a sync is green before it lands — and triggers the publish explicitly.
#
# First-party only: actions/checkout, actions/setup-go, actions/setup-node; git
# for the merge/resolution; gh CLI for PR creation.

on:
  schedule:
    - cron: '27 6 * * *'
  workflow_dispatch:
    inputs:
      upstream_remote:
        description: Upstream remote URL to sync from (default dop251/goja_nodejs).
        required: false
        default: https://github.com/dop251/goja_nodejs.git
        type: string
      upstream_ref:
        description: Upstream BRANCH to sync from (a branch name; default master).
        required: false
        default: master
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      synced: ${{ steps.push.outputs.result == 'ok' }}
      synced_sha: ${{ steps.push.outputs.sha }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Scheduled runs have no inputs context → these fall back to the dop251
      # defaults; manual dispatches may override either to sync a different ref
      # (e.g. a feature branch, or a controlled stand-in for verification).
      UPSTREAM_REMOTE: ${{ inputs.upstream_remote || 'https://github.com/dop251/goja_nodejs.git' }}
      UPSTREAM_BRANCH: ${{ inputs.upstream_ref || 'master' }}
      TARGET_BRANCH: main
    steps:
      - name: Checkout fork (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_BRANCH }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream "$UPSTREAM_REMOTE"
          git fetch upstream "$UPSTREAM_BRANCH" --tags --no-recurse-submodules

      - name: Check if sync is needed
        id: needed
        run: |
          if git merge-base --is-ancestor "upstream/$UPSTREAM_BRANCH" HEAD; then
            echo "sync=false" >> "$GITHUB_OUTPUT"
            echo "Already in sync with upstream/$UPSTREAM_BRANCH; nothing to do."
          else
            echo "sync=true" >> "$GITHUB_OUTPUT"
            echo "Upstream has new commits; proceeding with sync."
          fi

      - name: Compute sync branch id
        if: steps.needed.outputs.sync == 'true'
        id: id
        run: |
          short="$(git rev-parse --short=12 "upstream/$UPSTREAM_BRANCH")"
          echo "short=$short" >> "$GITHUB_OUTPUT"
          echo "branch=sync/upstream-$short" >> "$GITHUB_OUTPUT"

      - name: Attempt merge
        if: steps.needed.outputs.sync == 'true'
        id: merge
        run: |
          set +e
          # --no-ff forces a merge commit so HEAD~1 is always the pre-merge tip
          # and HEAD~1..upstream/master lists exactly the incoming commits.
          git merge "upstream/$UPSTREAM_BRANCH" --no-edit --no-ff > /tmp/merge.log 2>&1
          rc=$?
          echo "exitcode=$rc" >> "$GITHUB_OUTPUT"
          cat /tmp/merge.log
          if [ "$rc" -ne 0 ]; then
            git diff --name-only --diff-filter=U > /tmp/conflicts.txt
            echo "Conflicted files:"
            cat /tmp/conflicts.txt
          fi
          exit 0

      - name: Auto-resolve go.mod/go.sum conflicts
        # Only fires on conflict. Auto-resolves when conflicts are confined to
        # go.mod/go.sum: take upstream's dependency intent, re-apply the fork's
        # module-path rewrite + goja pin + go directive, regenerate go.sum via
        # `go mod tidy`, finalize the merge commit. Source-code conflicts are
        # left for the PR-fallback step.
        id: autoresolve
        if: steps.needed.outputs.sync == 'true' && steps.merge.outputs.exitcode != '0'
        run: |
          set -euo pipefail

          # Scope guard: only auto-resolve if every conflicted file is go.mod/go.sum.
          conflicts="$(git diff --name-only --diff-filter=U)"
          nonmodsum="$(printf '%s\n' "$conflicts" | grep -vE '^(go\.mod|go\.sum)$' || true)"
          if [ -n "$nonmodsum" ]; then
            echo "Non go.mod/go.sum conflict(s) present — falling back to PR:"
            printf '%s\n' "$nonmodsum"
            echo "autoresolve=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Capture the fork identity from the pre-merge tip (HEAD is still the
          # fork tip during a conflicted merge).
          FORK_GOJA_PIN="$(git show HEAD:go.mod | sed -nE 's/^[[:space:]]+github\.com\/joeycumines\/goja (v[0-9].*)/\1/p' | head -1)"
          FORK_GO_DIRECTIVE="$(git show HEAD:go.mod | sed -nE 's/^go ([0-9.]+)/\1/p' | head -1)"
          if [ -z "$FORK_GOJA_PIN" ] || [ -z "$FORK_GO_DIRECTIVE" ]; then
            echo "Could not capture fork goja pin / go directive — falling back to PR."
            echo "autoresolve=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Fork goja pin: $FORK_GOJA_PIN | go directive: $FORK_GO_DIRECTIVE"

          # Take upstream's go.mod and re-apply the fork rebrand.
          git checkout --theirs go.mod
          sed -i "s|^module github.com/dop251/goja_nodejs|module github.com/joeycumines/goja_nodejs|" go.mod
          sed -i -E "s|github\.com/dop251/goja (v[0-9].*)|github.com/joeycumines/goja ${FORK_GOJA_PIN}|" go.mod
          sed -i -E "s|^go [0-9.]+|go ${FORK_GO_DIRECTIVE}|" go.mod

          # Regenerate go.sum from the resolved go.mod (reconciles indirect deps;
          # needs network for genuinely new deps, which the runner has).
          rm -f go.sum
          go mod tidy

          git add go.mod go.sum
          # Clear the conflict list so the PR-fallback step does NOT fire.
          : > /tmp/conflicts.txt
          echo "autoresolve=true" >> "$GITHUB_OUTPUT"
          echo "go.mod/go.sum auto-resolved (fork identity preserved; upstream deps adopted)."

      - name: Finalize auto-resolved merge
        # Complete the merge commit with the resolved go.mod/go.sum so the
        # validate step runs against a committed tree (matching the clean path).
        if: steps.needed.outputs.sync == 'true' && steps.autoresolve.outputs.autoresolve == 'true'
        run: git commit --no-edit --no-verify

      - name: Open PR for conflicts
        # Unresolvable conflict (source code, or go.mod capture failed).
        if: steps.needed.outputs.sync == 'true' && steps.merge.outputs.exitcode != '0' && steps.autoresolve.outputs.autoresolve != 'true'
        env:
          SYNC_BRANCH: ${{ steps.id.outputs.branch }}
        run: |
          git add -A
          git commit --no-edit --no-verify
          git push --force origin "HEAD:refs/heads/$SYNC_BRANCH"

          {
            echo "Automatic upstream sync from \`dop251/goja_nodejs:master\` produced **conflicts** that need manual resolution."
            echo
            echo "**Conflicted files:**"
            echo
            while IFS= read -r f; do [ -n "$f" ] && echo "- \`$f\`"; done < /tmp/conflicts.txt
            echo
            echo "**Incoming commits:**"
            echo
            echo '```'
            git log --oneline HEAD~1.."upstream/$UPSTREAM_BRANCH"
            echo '```'
            echo
            echo "Resolve the markers, then merge this PR."
            echo
            echo "> **Note:** if \`go.mod\`/\`go.sum\` are among the conflicts, keep \`module github.com/joeycumines/goja_nodejs\` and the \`github.com/joeycumines/goja\` pin; adopt upstream's other dependency changes and run \`go mod tidy\`."
          } > /tmp/pr-body.md

          existing="$(gh pr list --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "Open PR #$existing already exists; refreshing it."
            gh pr edit "$existing" --title "sync: upstream master → main (conflicts)" --body-file /tmp/pr-body.md
          else
            gh pr create \
              --base "$TARGET_BRANCH" \
              --head "$SYNC_BRANCH" \
              --title "sync: upstream master → main (conflicts)" \
              --body-file /tmp/pr-body.md
          fi

      - name: Validate merged tree (vet + build + race + types)
        if: steps.needed.outputs.sync == 'true' && (steps.merge.outputs.exitcode == '0' || steps.autoresolve.outputs.autoresolve == 'true')
        id: validate
        run: |
          set +e
          go vet ./... > /tmp/vet.log 2>&1; vet_rc=$?
          go build ./... > /tmp/build.log 2>&1; build_rc=$?
          go test -race -vet=off ./... > /tmp/test.log 2>&1; test_rc=$?
          npm ci > /tmp/npm-install.log 2>&1; npm_install_rc=$?
          npm test --workspaces > /tmp/npm-test.log 2>&1; npm_test_rc=$?
          {
            echo "### go vet (exit $vet_rc)"; echo; cat /tmp/vet.log; echo;
            echo "### go build (exit $build_rc)"; echo; cat /tmp/build.log; echo;
            echo "### go test -race (exit $test_rc)"; echo; cat /tmp/test.log; echo;
            echo "### npm ci (exit $npm_install_rc)"; echo; cat /tmp/npm-install.log | tail -5; echo;
            echo "### npm test --workspaces (exit $npm_test_rc)"; echo; cat /tmp/npm-test.log; echo;
          } > /tmp/validate.log
          echo "vet=$vet_rc build=$build_rc test=$test_rc npm_install=$npm_install_rc npm_test=$npm_test_rc"
          if [ "$vet_rc" -eq 0 ] && [ "$build_rc" -eq 0 ] && [ "$test_rc" -eq 0 ] && [ "$npm_install_rc" -eq 0 ] && [ "$npm_test_rc" -eq 0 ]; then
            echo "result=pass" >> "$GITHUB_OUTPUT"
            echo "Validation passed."
          else
            echo "result=fail" >> "$GITHUB_OUTPUT"
            echo "Validation FAILED:"
            cat /tmp/validate.log
          fi
          exit 0

      - name: Push to main
        id: push
        if: steps.needed.outputs.sync == 'true' && (steps.merge.outputs.exitcode == '0' || steps.autoresolve.outputs.autoresolve == 'true') && steps.validate.outputs.result == 'pass'
        run: |
          set +e
          git push origin "$TARGET_BRANCH" > /tmp/push.log 2>&1; push_rc=$?
          echo "push_rc=$push_rc"
          if [ "$push_rc" -eq 0 ]; then
            echo "result=ok" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "Pushed synced main."
            git log --oneline -5 "$TARGET_BRANCH"
          else
            echo "result=failed" >> "$GITHUB_OUTPUT"
            echo "Direct push to main failed:"
            cat /tmp/push.log
          fi
          exit 0

      - name: Open PR (validation failed or push rejected)
        if: >
          steps.needed.outputs.sync == 'true'
          && (steps.merge.outputs.exitcode == '0' || steps.autoresolve.outputs.autoresolve == 'true')
          && (steps.validate.outputs.result == 'fail' || steps.push.outputs.result == 'failed')
        env:
          SYNC_BRANCH: ${{ steps.id.outputs.branch }}
          VALIDATE_RESULT: ${{ steps.validate.outputs.result }}
        run: |
          git push --force origin "HEAD:refs/heads/$SYNC_BRANCH"

          if [ "$VALIDATE_RESULT" = "fail" ]; then
            title="sync: upstream master → main (validation failing)"
            header="Upstream merged (and go.mod/go.sum auto-resolved if needed), but **validation failed** on the merged tree."
            detail="$(cat /tmp/validate.log)"
          else
            title="sync: upstream master → main (push rejected)"
            header="Upstream merged and validated cleanly, but the direct push to main was **rejected** (e.g. branch protection)."
            detail="$(cat /tmp/push.log)"
          fi

          {
            echo "$header"
            echo
            echo "**Incoming commits:**"
            echo
            echo '```'
            git log --oneline HEAD~1.."upstream/$UPSTREAM_BRANCH"
            echo '```'
            echo
            echo '<details><summary>Details</summary>'
            echo
            echo '```'
            echo "$detail"
            echo '```'
            echo
            echo '</details>'
          } > /tmp/pr-body.md

          existing="$(gh pr list --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "Open PR #$existing already exists; refreshing it."
            gh pr edit "$existing" --title "$title" --body-file /tmp/pr-body.md
          else
            gh pr create \
              --base "$TARGET_BRANCH" \
              --head "$SYNC_BRANCH" \
              --title "$title" \
              --body-file /tmp/pr-body.md
          fi

  publish:
    # After a successful sync push, republish the type definitions so the npm
    # `latest` tag tracks the latest synced HEAD.
    needs: sync
    if: needs.sync.outputs.synced == 'true'
    uses: ./.github/workflows/publish-types.yml
    with:
      ref: ${{ needs.sync.outputs.synced_sha }}
    permissions:
      contents: read
      packages: write
