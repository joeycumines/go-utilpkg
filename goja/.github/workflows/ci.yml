name: CI

# Runs on every push and pull request. Cancels superseded runs for the same ref
# so force-pushes and rapid follow-up commits don't waste CI minutes.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (fmt, vet, staticcheck, mod)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.x'
          check-latest: true
          # Module + build caching is enabled by default in setup-go.

      - name: Check formatting (gofmt)
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "::error::Files need gofmt:"
            echo "$fmt_out"
            exit 1
          fi

      - name: Check go.mod / go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Verify modules
        run: go mod verify

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        # Honors staticcheck.conf at the repo root. Pinned to the same release
        # upstream goja targets; install is first-party (go install, no action).
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.1
          staticcheck ./...

  test:
    name: Test (go ${{ matrix.go-version }} / ${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.27.x', '1.x']
        arch: ['amd64', '386']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true

      - name: Read pinned test262 commit
        id: test262
        run: |
          sha="$(grep -E '^sha=' .tc39_test262_checkout.sh | head -1 | cut -d= -f2- | tr -d '[:space:]')"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Cache tc39 test262
        id: test262-cache
        uses: actions/cache@v6
        with:
          path: testdata/test262
          key: test262-${{ steps.test262.outputs.sha }}

      - name: Checkout tc39 tests
        # Only run on cache miss: the checkout script calls `git remote add`,
        # which fails if the dir already exists (i.e. on a cache hit).
        if: steps.test262-cache.outputs.cache-hit != 'true'
        run: ./.tc39_test262_checkout.sh

      - name: Run tests
        env:
          GOARCH: ${{ matrix.arch }}
        run: go test -vet=off ./...

  race-and-coverage:
    name: Race + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.x'
          check-latest: true

      - name: Read pinned test262 commit
        id: test262
        run: |
          sha="$(grep -E '^sha=' .tc39_test262_checkout.sh | head -1 | cut -d= -f2- | tr -d '[:space:]')"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Cache tc39 test262
        id: test262-cache
        uses: actions/cache@v6
        with:
          path: testdata/test262
          key: test262-${{ steps.test262.outputs.sha }}

      - name: Checkout tc39 tests
        if: steps.test262-cache.outputs.cache-hit != 'true'
        run: ./.tc39_test262_checkout.sh

      - name: Run race detector
        # tc39 is skipped via -short: the full test262 suite under -race is
        # pathologically slow (individual URI-encoding subtests take minutes
        # each, blowing the 10m default test timeout). Only the tc39 tests use
        # testing.Short(), so the dedicated concurrency tests
        # (TestPromiseJobEnqueuer, TestAsyncContextTracker) still run under the
        # race detector and exercise the promise-job machinery.
        run: go test -race -short -vet=off ./...

      - name: Run coverage (full suite, no race)
        run: go test -coverprofile=coverage.out -covermode=atomic -vet=off -timeout 15m ./...

      - name: Coverage summary
        run: |
          go tool cover -func=coverage.out | tail -1

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.run_id }}
          path: coverage.out
          if-no-files-found: warn
          retention-days: 14
